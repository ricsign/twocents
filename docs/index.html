<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Daily Pick</title>
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script>(function(){var t=null;try{t=localStorage.getItem('dp-theme')}catch(e){}if(t!=='light'&&t!=='dark'){t=(window.matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark'}document.documentElement.setAttribute('data-theme',t)})()</script>
<style>
:root{
--bg:#0b0d10;--s1:#111419;--s2:#161a20;--s3:#1f242c;--line:#21262e;--line2:#2c333d;
--text:#e8ebef;--muted:#a4adb8;--faint:#7e8894;
--accent:#7ea6ff;--accent-ink:#0b0d10;--accent-soft:rgba(126,166,255,.14);--violet:#c49bff;
--green:#3fd08f;--green-soft:rgba(63,208,143,.13);--red:#ff6f6f;--red-soft:rgba(255,111,111,.13);
--amber:#f2b440;--amber-fill:#f2b440;--amber-soft:rgba(242,180,64,.14);--grey:#8d96a1;--grey-soft:rgba(141,150,161,.16);
--ink:#0b0d10;--tt:#1b2027;--cp:16px;
--r:12px;--font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
color-scheme:dark;
}
:root[data-theme=light]{
--bg:#f4f5f7;--s1:#ffffff;--s2:#f8f9fb;--s3:#eceef2;--line:#e3e6ea;--line2:#d5d9df;
--text:#0e1116;--muted:#4c5561;--faint:#5f6873;
--accent:#2f5bd3;--accent-ink:#ffffff;--accent-soft:rgba(47,91,211,.10);--violet:#7a45c9;
--green:#07733f;--green-soft:rgba(7,115,63,.10);--red:#c22f2f;--red-soft:rgba(194,47,47,.09);
--amber:#875200;--amber-fill:#d18e1c;--amber-soft:rgba(186,120,0,.12);--grey:#5c6570;--grey-soft:rgba(92,101,112,.13);
--ink:#ffffff;--tt:#ffffff;
color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 var(--font);font-feature-settings:"cv11" 1;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{margin:0;font-weight:600}
b,td,.v,.big,.val,.tt,.kv,.stats,.mini3,.tile,.kpi,.hw-l,.fr,.ring,.chip,.meta,.fil .d,.sec,.statrow,.dvh{font-variant-numeric:tabular-nums}
.pos{color:var(--green)}.neg{color:var(--red)}.amb{color:var(--amber)}.mut{color:var(--muted)}.fnt{color:var(--faint)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lbl{font-size:11px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}

/* top bar */
.top{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{max-width:1240px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;gap:20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{display:block}
.tabs{display:flex;gap:2px}
.tab{height:32px;padding:0 12px;border-radius:8px;color:var(--muted);font-weight:500;font-size:14px;transition:background .15s,color .15s}
.tab:hover{color:var(--text);background:var(--s2)}
.tab[aria-selected=true]{color:var(--text);background:var(--s3)}
.top-r{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 9px;border:1px solid var(--line2);border-radius:7px;font-size:12px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--text);font-weight:600}
.chip .fm{display:none}
.iconbtn{width:32px;height:32px;border-radius:8px;border:1px solid var(--line2);display:grid;place-items:center;color:var(--muted);flex:none}
.iconbtn:hover{color:var(--text);background:var(--s2)}
@media (max-width:980px){.ts{display:none}.chip .fm{display:inline}}
@media (max-width:760px){
html{scroll-padding-top:104px}
.top-in{height:auto;display:grid;grid-template-columns:auto 1fr;grid-template-areas:"brand right" "tabs tabs";gap:8px 10px;padding:9px 16px 0}
.brand{grid-area:brand}.top-r{grid-area:right;justify-content:flex-end;gap:6px}
.tabs{grid-area:tabs;margin:0 -4px}.tab{flex:1;height:40px;border-radius:0;background:none!important;box-shadow:inset 0 -2px 0 transparent;padding:0 4px}
.tab[aria-selected=true]{box-shadow:inset 0 -2px 0 var(--accent)}
.iconbtn{width:40px;height:40px}
}
@media (max-width:420px){.brand .wm{display:none}.chip{padding:0 7px}}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:20px 20px 56px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px;align-items:start}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (max-width:1023px){.c8,.c7,.c6,.c5,.c4{grid-column:span 12}}
@media (max-width:640px){.wrap{padding:14px 16px 40px}.grid,.stack{gap:12px}:root{--cp:14px}}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:var(--cp);min-width:0}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;min-height:20px}
.ch h2{font-size:14px;font-weight:600;white-space:nowrap}
.ch .meta{font-size:12px;color:var(--faint);text-align:right;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.sub2{grid-template-columns:1fr;gap:12px}}
.empty{display:grid;place-items:center;min-height:72px;color:var(--faint);font-size:13px;text-align:center;border:1px dashed var(--line2);border-radius:10px;padding:16px}

/* pills */
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap;line-height:1}
.pill i{font-style:normal;font-size:11px;font-weight:700}
.pill.pass{color:var(--green);background:var(--green-soft)}
.pill.warn{color:var(--amber);background:var(--amber-soft)}
.pill.fail{color:var(--red);background:var(--red-soft)}
.pill.na{color:var(--grey);background:var(--grey-soft)}
.pill.acc{color:var(--accent);background:var(--accent-soft)}
.pill.lg{height:24px;padding:0 10px}
.tag{display:inline-flex;align-items:center;height:20px;padding:0 6px;border-radius:5px;font-size:11px;font-weight:600;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.red{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,transparent);background:var(--red-soft)}
.tag.amb{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,transparent);background:var(--amber-soft)}
.tag.acc{color:var(--accent);border-color:color-mix(in srgb,var(--accent) 40%,transparent)}

/* hero */
.hero{padding:20px}
.hero-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:center}
.eyebrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.buy{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:6px;background:var(--text);color:var(--bg);font-weight:700;font-size:12px;letter-spacing:.08em}
.buy-at{font-size:13px;color:var(--muted)}.buy-at b{color:var(--text);font-weight:600}
.hchip{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:500;background:var(--s3);color:var(--muted);white-space:nowrap}
.hchip b{color:var(--text);font-weight:600}
a.hchip:hover{color:var(--text);box-shadow:inset 0 0 0 1px var(--line2)}
.tk{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.tk h1{font-size:44px;line-height:1.05;letter-spacing:-.025em;font-weight:700}
.tk .nm{font-size:16px;font-weight:500}
.sect{font-size:13px;color:var(--faint);margin-top:2px}
.kv{display:flex;flex-wrap:wrap;gap:6px 24px;margin-top:12px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:11px;color:var(--faint)}
.kv b{font-size:14px;font-weight:600}
.rblock{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{position:relative;width:120px;height:120px;flex:none}
.ring svg{display:block}
.ring .rv{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .rv b{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1}
.ring .rv b small{font-size:16px;color:var(--faint);font-weight:500}
.ring .rv span{font-size:11px;color:var(--faint);margin-top:4px}
.rblock .mx{font-size:12px;color:var(--faint);white-space:nowrap}
.plan{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
.plan-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.acct{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--faint)}
.acct label{display:flex;align-items:center;height:32px;border:1px solid var(--line2);border-radius:8px;background:var(--s2);padding:0 8px;gap:2px;color:var(--muted)}
.acct label:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.acct input{width:84px;border:0;background:none;color:var(--text);font:600 14px var(--font);font-variant-numeric:tabular-nums;outline:none;padding:0}
.tiles{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tile{background:var(--s2);padding:11px 13px 12px;min-width:0}
.tile .v{font-size:20px;font-weight:600;letter-spacing:-.015em;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .s{font-size:12px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1023px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){
.hero{padding:16px}.tk .nm{font-size:14px}
.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles .tile:last-child{grid-column:1/-1}
.hero-top{gap:16px}.ring,.ring svg{width:96px;height:96px}.ring .rv b{font-size:20px}.ring .rv b small{font-size:14px}
}
.stand h1{font-size:28px;letter-spacing:-.02em}
.ph{display:none}
@media (max-width:640px){.stand .hero-top{grid-template-columns:1fr}}
@media (max-width:640px){.rp{display:none}.kv{gap:6px 14px}.tile .s{white-space:normal}.ph{display:inline-flex}table.book .hp{display:none}.held .tr{width:36px!important}.held{gap:6px}.wdy{display:none}table.book .tkc2{display:flex;flex-direction:column;align-items:flex-start;gap:3px}}

/* book */
.held{display:inline-flex;align-items:center;gap:8px}
.held .tr{position:relative;width:64px;height:6px;border-radius:3px;background:var(--s3);overflow:hidden}
.held .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent)}
tr.sell td{background:var(--amber-soft)}
tr.sell td:first-child{box-shadow:inset 2px 0 0 var(--amber-fill)}

/* charts */
.chart{position:relative;width:100%;min-width:0}
.cw{position:relative;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.cw svg{display:block;overflow:visible}
svg text{font-family:var(--font);font-variant-numeric:tabular-nums}
.ax{fill:var(--faint);font-size:11px}
.gl{stroke:var(--line);stroke-width:1}
.xv{position:absolute;display:none;width:1px;background:var(--muted);opacity:.55;pointer-events:none}
.xh{position:absolute;display:none;height:1px;background:var(--muted);opacity:.45;pointer-events:none}
.xl{position:absolute;display:none;height:16px;line-height:16px;padding:0 4px;border-radius:3px;background:var(--text);color:var(--bg);font-size:11px;font-weight:600;pointer-events:none}
.xd{position:absolute;width:7px;height:7px;margin:-3.5px 0 0 -3.5px;border-radius:50%;border:1.5px solid var(--s1);pointer-events:none}
.tt{position:absolute;display:none;z-index:5;pointer-events:none;background:var(--tt);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-size:12px;box-shadow:0 8px 24px rgba(0,0,0,.28);white-space:nowrap;min-width:110px}
.tt .d{color:var(--faint);font-size:11px;margin-bottom:3px}
.tt .g{display:grid;grid-template-columns:auto auto;gap:1px 12px}
.tt .g span{color:var(--faint)}.tt .g b{font-weight:600;text-align:right}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sw{display:inline-block;width:14px;height:0;border-top:2px solid}
.sw.b{width:10px;height:10px;border:0;border-radius:2px}
.lgbtn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:6px;border:1px solid var(--line2);font-size:12px;color:var(--text)}
.lgbtn[aria-pressed=false]{color:var(--faint);border-style:dashed}
.lgbtn[aria-pressed=false] .sw{border-top-color:transparent!important;height:8px;width:14px;border:1.5px solid var(--faint)!important;border-radius:2px}
.statrow{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12px;color:var(--faint);margin:-4px 0 10px}
.statrow b{color:var(--text);font-weight:600;margin-left:4px}

/* checks */
.lgroup+.lgroup{margin-top:14px}
.lgh{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.lrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto 56px;gap:4px 12px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.lrow:first-of-type{border-top:0}
.lrow .nm{font-weight:500;font-size:14px}
.lrow .dt{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow .val{font-weight:600;font-size:13px;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.mbar{height:4px;border-radius:2px;background:var(--s3);overflow:hidden}
.mbar i{display:block;height:100%;border-radius:2px}
.lrow .pill{justify-self:start}
@media (max-width:420px){.lrow{grid-template-columns:58px minmax(0,1fr) auto}.lrow .mbar{display:none}.lrow .val{max-width:110px}}

/* evidence */
.ev{display:flex;flex-direction:column}.ev .foot2{margin-top:auto;padding-top:12px}
.evmid{flex:1;display:flex;flex-direction:column;justify-content:center}
.big{font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.2}
.bigrow{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.bigrow .mut{font-size:13px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stats div{display:flex;flex-direction:column;min-width:0}
.stats span{font-size:11px;color:var(--faint);white-space:nowrap}
.stats b{font-size:14px;font-weight:600;white-space:nowrap}
.simrow{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12px;color:var(--faint);display:flex;flex-wrap:wrap;gap:2px 10px}
.simrow b{color:var(--text);font-weight:600}
.rng{position:relative;height:66px;margin:6px 0 0}
.rng .base{position:absolute;left:0;right:0;top:24px;height:8px;border-radius:4px;background:var(--s3)}
.rng .tr{position:absolute;top:24px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.rng .mk{position:absolute;top:20px;width:3px;height:16px;margin-left:-1.5px;border-radius:2px;background:var(--accent)}
.rng .now{position:absolute;top:18px;width:2px;height:20px;margin-left:-1px;background:var(--text);border-radius:1px}
.rng .nl,.rng .bl{position:absolute;font-size:12px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.rng .nl{top:0}.rng .bl{top:42px;display:flex;flex-direction:column;line-height:1.25;align-items:center}
.rng .bl.l{transform:none;align-items:flex-start}.rng .bl.r{transform:translateX(-100%);align-items:flex-end}
.rng .bl span{font-size:11px;color:var(--faint)}
.rng b{color:var(--text);font-weight:600}
.hw{position:relative;height:44px;margin:6px 0 4px}
.hw .base{position:absolute;top:24px;left:0;right:0;height:8px;border-radius:4px;background:var(--s3)}
.hw .win{position:absolute;top:24px;height:8px;border-radius:4px;background:color-mix(in srgb,var(--accent) 55%,transparent)}
.hw .ev{position:absolute;top:18px;width:3px;height:20px;margin-left:-1.5px;border-radius:2px}
.hw .evl{position:absolute;top:0;font-size:12px;color:var(--muted);white-space:nowrap;transform:translateX(-50%)}
.hw .evl b{color:var(--text);font-weight:600}
.hw-l{position:relative;height:16px;font-size:11px;color:var(--faint)}
.hw-l span{position:absolute;transform:translateX(-50%);white-space:nowrap}

/* news */
.news{list-style:none;margin:0;padding:0}
.news li{display:grid;grid-template-columns:10px minmax(0,1fr);gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.news li:first-child{border-top:0;padding-top:2px}
.dot{width:8px;height:8px;border-radius:50%;margin-top:6px}
.news .t{font-size:14px;font-weight:500;line-height:1.35}
.news a.t:hover{color:var(--accent)}
.news .m{grid-column:2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:12px;color:var(--faint)}
.more{margin-top:6px;font-size:13px;color:var(--accent);font-weight:500;min-height:32px}
.fil{list-style:none;margin:0;padding:0}
.fil li{display:grid;grid-template-columns:52px minmax(0,1fr);gap:2px 12px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.fil li:first-child{border-top:0}
.fil .d{color:var(--faint);font-size:12px;padding-top:1px}
.fil .it{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.subh{display:flex;align-items:center;justify-content:space-between;margin:16px 0 6px;padding-top:14px;border-top:1px solid var(--line)}

/* gate */
.gate-top{display:grid;grid-template-columns:136px minmax(0,1fr);gap:16px;align-items:center}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;align-items:center;gap:8px;font-size:13px;min-width:0}
.rule .rl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.rule b{font-weight:600}
.gauge{position:relative;text-align:center}
.gauge .gv{position:absolute;left:0;right:0;top:34px}
.gauge .gv b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.gauge .gv span{font-size:11px;color:var(--faint)}
.spyh{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:16px 0 6px;font-size:13px}
.spyh b{font-size:16px;font-weight:600}
.mini3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.mini3 span{display:block;font-size:11px;color:var(--faint)}
.mini3 b{font-size:16px;font-weight:600}
.mini3 small{font-size:12px;color:var(--faint);margin-left:4px}
.pbar{position:relative;height:4px;border-radius:2px;background:var(--s3);margin-top:6px}
.pbar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px}
.pbar u{position:absolute;top:-3px;width:1px;height:10px;background:var(--faint)}
@media (max-width:420px){.gate-top{grid-template-columns:1fr}.gauge{width:136px;margin:0 auto}}

/* funnel */
.fn{display:flex;flex-direction:column;gap:6px}
.fr{display:grid;grid-template-columns:140px minmax(0,1fr) 40px 40px;gap:10px;align-items:center;font-size:13px}
.fr .st{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

var el = document.getElementById('p-' + t);
if(force || !built[t]){ try{ el.innerHTML = RENDER[t](); }catch(e){ el.innerHTML = '<div class="card">' + empty('Section unavailable') + '</div>'; if(window.console) console.warn(e); } built[t] = true; }
return el;
}
function show(){
var t = cur();
TABS.forEach(function(x){ var b = document.getElementById('t-' + x), p = document.getElementById('p-' + x), on = x === t; b.setAttribute('aria-selected', on); b.tabIndex = on ? 0 : -1; p.hidden = !on; });
drawCharts(build(t));
}
function renderAll(){
built = {}; renderTop(); show();
var m = obj(D.meta), gt = Date.parse(m.generated_at);
document.getElementById('foot').innerHTML = '<div class="foot"><span>Daily Pick · v' + esc(m.version || DASH) + (m.sample ? ' · sample data' : '') + '</span><span>Generated ' + (isFinite(gt) ? esc(new Date(gt).toUTCString().replace(' GMT', ' UTC').slice(5)) : DASH) + '</span><span>Not investment advice</span></div>';
}
function errorState(){
document.getElementById('topr').innerHTML = '<button class="iconbtn" id="theme" aria-label="Switch theme">' + themeIcon() + '</button>';
TABS.forEach(function(x){ document.getElementById('p-' + x).hidden = x !== 'today'; });
document.getElementById('p-today').innerHTML = '<div class="err card"><h1>No data</h1><div class="mut">pick.json unavailable</div><button class="btn" onclick="location.reload()">Retry</button></div>';
}
function valid(j){ return !!(j && typeof j === 'object' && j.meta && typeof j.meta === 'object' && (j.pick === null || (j.pick && typeof j.pick === 'object' && typeof j.pick.ticker === 'string')) && j.regime && typeof j.regime === 'object' && !Array.isArray(j.regime) && Array.isArray(j.candidates)); }

/* events */
var tabsEl = document.querySelector('.tabs');
tabsEl.addEventListener('click', function(e){ var b = e.target.closest('[data-tab]'); if(b) location.hash = b.dataset.tab; });
tabsEl.addEventListener('keydown', function(e){
var i = TABS.indexOf(cur());
if(e.key === 'ArrowRight') i = (i + 1) % TABS.length; else if(e.key === 'ArrowLeft') i = (i - 1 + TABS.length) % TABS.length; else if(e.key === 'Home') i = 0; else if(e.key === 'End') i = TABS.length - 1; else return;
e.preventDefault(); location.hash = TABS[i]; document.getElementById('t-' + TABS[i]).focus();
});
window.addEventListener('hashchange', function(){ if(D){ show(); window.scrollTo(0, 0); } });
document.addEventListener('click', function(e){
var t = e.target;
if(t.closest('#theme')){ var nt = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', nt); try{ localStorage.setItem('dp-theme', nt); }catch(_){} document.getElementById('theme').innerHTML = themeIcon(); return; }
var s = t.closest('[data-sort]'); if(s){ var k = s.dataset.sort; ST.sort = {k: k, d: ST.sort.k === k ? -ST.sort.d : (k === 'rank' || k === 'ticker' || k === 'dip5' ? 1 : -1)}; refreshTables('[data-sort="' + k + '"]'); return; }
if(t.closest('a')) return;
var r = t.closest('tr.rw'); if(r){ var tk = r.dataset.tk; ST.open[tk] = !ST.open[tk]; refreshTables('.tkbtn[data-tk="' + CSS.escape(tk) + '"]'); return; }
var q = t.closest('[data-eq]'); if(q){ ST.eq[q.dataset.eq] = ST.eq[q.dataset.eq] === false; q.setAttribute('aria-pressed', ST.eq[q.dataset.eq] !== false); var c = document.querySelector('[data-ch="eq"]'); if(c){ c._w = 0; drawCharts(c.parentNode); } return; }
if(t.closest('#newsmore')){ ST.newsAll = !ST.newsAll; var nc = document.getElementById('newscard'); if(nc){ nc.outerHTML = newsCard(D.pick); var nb = document.getElementById('newsmore'); if(nb) nb.focus(); } return; }
});
function refreshTables(focusSel){
var sl = {};
document.querySelectorAll('.tw[data-tw="cand"]').forEach(function(w, i){ sl[i] = w.scrollLeft; });
document.querySelectorAll('.tw[data-tw="cand"]').forEach(function(w, i){ var tmp = document.createElement('div'); tmp.innerHTML = candTable(); var nw = tmp.firstChild; w.replaceWith(nw); nw.scrollLeft = sl[i] || 0; });
if(focusSel){ var f = document.querySelector('section:not([hidden]) ' + focusSel); if(f) f.focus({preventScroll: true}); }
}
document.addEventListener('input', function(e){
if(e.target.id !== 'acct') return;
var raw = e.target.value.replace(/[^0-9.]/g, ''), v = parseFloat(raw);
if(raw === ''){ ST.acct = null; ST.acctBad = true; try{ localStorage.removeItem('dp-acct'); }catch(_){} }
else if(!(v > 0) || !isFinite(v)){ ST.acctBad = true; }
else { ST.acct = v; ST.acctBad = false; try{ localStorage.setItem('dp-acct', String(v)); }catch(_){} }
var s = sizing(), a = document.getElementById('sz-sh'), b = document.getElementById('sz-sub');
if(a) a.textContent = isNum(s.sh) ? num(s.sh) + ' sh' : DASH; if(b) b.innerHTML = sizeSub(s);
});
document.addEventListener('focusout', function(e){
if(e.target.id !== 'acct') return;
if(ST.acctBad){ ST.acctBad = false; if(e.target.value.replace(/[^0-9.]/g, '') !== '') ST.acct = ST.acct || null; }
var s = sizing(); e.target.value = isNum(s.acct) ? Math.round(s.acct).toLocaleString('en-US') : '';
var a = document.getElementById('sz-sh'), b = document.getElementById('sz-sub'); if(a) a.textContent = isNum(s.sh) ? num(s.sh) + ' sh' : DASH; if(b) b.innerHTML = sizeSub(s);
});
var lastW = window.innerWidth, rz = 0;
window.addEventListener('resize', function(){ if(window.innerWidth === lastW) return; lastW = window.innerWidth; cancelAnimationFrame(rz); rz = requestAnimationFrame(function(){ var el = document.getElementById('p-' + cur()); if(D && el) drawCharts(el); }); });

/* boot */
document.getElementById('theme').innerHTML = themeIcon();
function gen(d){ var t = d && d.meta && Date.parse(d.meta.generated_at); return isFinite(t) ? t : -Infinity; }
D = valid(window.PICK) ? window.PICK : null;
if(D) renderAll();
function fail(){ if(!D) errorState(); }
try{
if(location.protocol === 'file:') throw 0;
var ctl = window.AbortController ? new AbortController() : null, tmo = setTimeout(function(){ if(ctl) ctl.abort(); }, 8000);
fetch('data/pick.json', {cache: 'no-store', signal: ctl ? ctl.signal : undefined})
.then(function(r){ return r.ok ? r.json() : null; })
.then(function(j){ clearTimeout(tmo); if(valid(j) && (!D || gen(j) > gen(D))){ D = j; renderAll(); } else fail(); })
.catch(function(){ clearTimeout(tmo); fail(); });
}catch(e){ fail(); }
})();
</script>
</body>
